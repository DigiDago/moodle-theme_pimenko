name: Moodle Plugin CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
      - 'MOODLE_*_DEV'
      - 'MOODLE_*_STABLE'

jobs:
  # Job to dynamically determine the Moodle + PHP matrix
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          # Detect the target branch
          BRANCH="${{ github.base_ref || github.ref_name }}"
          echo "Target branch detected: $BRANCH"

          # Helper function to map Moodle branches to PHP versions
          get_php() {
            case "$1" in
              MOODLE_3[0-1]*) echo "7.0" ;;
              MOODLE_3[2-3]*) echo "7.1" ;;
              MOODLE_3[4-5]*) echo "7.2" ;;
              MOODLE_3[6-7]*) echo "7.3" ;;
              MOODLE_3[8-9]*) echo "7.4" ;;
              MOODLE_311*)    echo "8.0" ;;
              MOODLE_400*)    echo "8.0" ;;
              MOODLE_401*)    echo "7.4" ;;
              MOODLE_402*)    echo "8.0" ;;
              MOODLE_403*)    echo "8.0" ;;
              MOODLE_404*)    echo "8.3" ;;
              MOODLE_405*)    echo "8.1" ;;
              MOODLE_50[0-1]*) echo "8.2" ;;
              *)              echo "8.3" ;; # Default fallback
            esac
          }

          # CASE 1: Direct STABLE branch (e.g., MOODLE_405_STABLE)
          if [[ "$BRANCH" =~ ^MOODLE_[0-9]{3}_STABLE$ ]]; then
            PHP=$(get_php "$BRANCH")
            JSON="[{\"branch\": \"$BRANCH\", \"php\": \"$PHP\"}]"

          # CASE 2: Specific DEV version (e.g., MOODLE_405_DEV)
          elif [[ "$BRANCH" =~ ^MOODLE_([0-9]{3})_DEV$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            M_BRANCH="MOODLE_${VERSION}_STABLE"
            PHP=$(get_php "$M_BRANCH")
            JSON="[{\"branch\": \"$M_BRANCH\", \"php\": \"$PHP\"}]"

          # CASE 3: Generic range (e.g., MOODLE_40X_DEV)
          elif [[ "$BRANCH" =~ ^MOODLE_([0-9])0X_DEV$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            if [[ "$MAJOR" == "4" ]]; then
              JSON='[
                {"branch": "MOODLE_400_STABLE", "php": "8.0"},
                {"branch": "MOODLE_401_STABLE", "php": "7.4"},
                {"branch": "MOODLE_402_STABLE", "php": "8.0"},
                {"branch": "MOODLE_403_STABLE", "php": "8.0"},
                {"branch": "MOODLE_404_STABLE", "php": "8.3"},
                {"branch": "MOODLE_405_STABLE", "php": "8.1"}
              ]'
            elif [[ "$MAJOR" == "5" ]]; then
              JSON='[
                {"branch": "MOODLE_500_STABLE", "php": "8.2"},
                {"branch": "MOODLE_501_STABLE", "php": "8.2"}
              ]'
            fi

          # CASE 4: Default matrix (main, master, dev)
          else
            JSON='[
              {"branch": "MOODLE_405_STABLE", "php": "8.1"},
              {"branch": "MOODLE_500_STABLE", "php": "8.2"},
              {"branch": "MOODLE_501_STABLE", "php": "8.2"}
            ]'
          fi

          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  # Main testing and linting job
  test:
    needs: setup
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # include pulls the branch/php pairs from the setup job
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
        database: [ pgsql, mariadb ]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: |
          # Dynamic path detection for Moodle 5.1+ vs Legacy
          if [ -d "moodle/public/theme/pimenko" ]; then
            PLUGIN_PATH="moodle/public/theme/pimenko"
          else
            PLUGIN_PATH="moodle/theme/pimenko"
          fi

          CONFIG_FILE="$PLUGIN_PATH/phpunit.xml"

          if [ ! -f "$CONFIG_FILE" ]; then
             echo "::error::Config file not found at $CONFIG_FILE"
             exit 1
          fi

          moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --tags "@theme_pimenko"

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1